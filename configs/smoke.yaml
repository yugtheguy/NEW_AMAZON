extends: base.yaml
project:
  profile: smoke
paths:
  artifact_root: artifacts/smoke
runtime:
  heartbeat_seconds: 1
  stall_seconds: 10
  warning_ram_fraction: 0.95
  critical_ram_fraction: 0.99
sharding:
  default_rows: 10
retrieval:
  exact_structured:
    exact_name_max_bucket: 3
    exact_address_max_bucket: 3
    structured_max_bucket: 3
    rare_token_max_df: 3
  multikey:
    target_batch_rows: 2
    min_name_token_length: 3
    min_address_token_length: 2
    rare_name_token_max_df: 10
    rare_address_token_max_df: 3
    rare_name_bucket_cap: 3
    name_number_bucket_cap: 3
    number_address_bucket_cap: 3
    name_address_bucket_cap: 3
    address_pair_bucket_cap: 3
    translit_name_bucket_cap: 3
    translit_name_number_bucket_cap: 3
    blocker_max_candidates_per_target: 5
normalization:
  expected_dataset_fingerprint: null
  expected_country_rows: null
  shard_rows: 3
  input_block_size_bytes: 4096

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-er"
version = "0.1.0"
description = "Restartable business entity resolution pipeline for the Amazon ML Challenge 2026"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "PyYAML>=6.0,<7",
  "psutil>=5.9,<8",
]

[project.optional-dependencies]
data = ["duckdb>=1.2,<2", "pyarrow>=18,<24", "Unidecode>=1.3,<2"]
retrieval = ["scikit-learn>=1.5,<2", "scipy>=1.12,<2"]
models = []
gpu = []
dev = ["pytest>=8,<9"]

[project.scripts]
amazon-er = "amazon_er.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest_cache/tmp"
testpaths = ["tests"]
